name: Android CI

on:
  pull_request:
  push:
    branches: [ main ]

# Cancel superseded runs for the same PR/branch
concurrency:
  group: android-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Build with Gradle
        run: ./gradlew assembleDebug
      - name: Tests
        run: ./gradlew :shared:jvmTest
      - name: Build server
        run: ./gradlew :server:assemble

  androidTest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Android Instrumentation Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          script: ./gradlew androidApp:connectedAndroidTest
