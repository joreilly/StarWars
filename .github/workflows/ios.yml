name: iOS CI

on:
  pull_request:
  push:
    branches: [ main ]

# Cancel superseded runs for the same PR/branch
concurrency:
  group: ios-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # Kotlin/Native compile only (no xcodebuild) — runs on Linux.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Build iOS shared code
        run: ./gradlew :shared:compileKotlinIosArm64
