kotlin.code.style=official

xcodeproj=./iosApp

kotlin.mpp.stability.nowarn=true
kotlin.native.toolchain.enabled=false

org.gradle.jvmargs=-Xmx2048M -Dkotlin.daemon.jvm.options\="-Xmx2048M"
org.gradle.parallel=true
android.useAndroidX=true

org.jetbrains.compose.experimental.wasm.enabled=true

# Incremental Kotlin/Native compilation is off: with Swift export enabled (Kotlin 2.4.20) it crashes
# the compiler while building the cache for the generated Flow bridge (SwiftFlowIterator_next).
kotlin.incremental.native=false
